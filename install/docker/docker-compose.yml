# =============================================================================
# QMD — Docker Compose
#
# All configurable options live in .env (copy from .env.example).
#
# Usage:
#   cd install/docker
#   cp .env.example .env  # edit AGENT_BASE and AGENT_NETWORK
#   docker compose up -d
#
# Peer containers (paperclip, openfang, …) that declare the same external
# network can reach QMD at:  http://qmd:8181/mcp
# =============================================================================

name: agent-phi-qmd

services:
  qmd:
    build:
      context: ../..          # repo root (where Dockerfile reads source from)
      dockerfile: install/docker/Dockerfile

    container_name: qmd

    restart: unless-stopped

    # ---- persistent volumes -------------------------------------------------
    # All qmd state (SQLite index, model files, collection YAML config) lives
    # under ${AGENT_BASE}/state/qmd on the host, mounted as /data inside the
    # container.  XDG dirs point into /data so qmd writes to:
    #   cache  → /data/cache/qmd  (index.sqlite, downloaded models)
    #   config → /data/config/qmd (collection YAML definitions)
    # Docker Compose does NOT expand ~ in volume source paths; use an
    # absolute path in .env.
    volumes:
      - type: bind
        source: ${AGENT_BASE:-~/agent-phi}/state/qmd
        target: /data
        bind:
          create_host_path: true

    # ---- port mapping -------------------------------------------------------
    # QMD_PORT (default 8181) exposes the MCP HTTP server on the host.
    # Remove / comment out the ports section if host-level access is not needed
    # (containers on AGENT_NETWORK can still reach qmd:8181 internally).
    ports:
      - "${QMD_PORT:-8181}:8181"

    # ---- environment --------------------------------------------------------
    environment:
      # Map XDG dirs to the volume mount targets set in the Dockerfile
      XDG_CACHE_HOME: /data/cache
      XDG_CONFIG_HOME: /data/config
      # Bind on all interfaces so peer containers can connect
      QMD_HTTP_HOST: "0.0.0.0"

    # ---- shared agent network -----------------------------------------------
    networks:
      - agent-net

# =============================================================================
# Shared external network
#
# This network is declared as *external* so it persists across individual
# compose projects and can be joined by other agent services (paperclip,
# openfang, etc.) using the same network name.
#
# Create it once before the first `docker compose up`:
#   docker network create ${AGENT_NETWORK:-agent-phi}
#
# Other compose files join it with:
#   networks:
#     agent-net:
#       external: true
#       name: ${AGENT_NETWORK:-agent-phi}
# =============================================================================
networks:
  agent-net:
    external: true
    name: ${AGENT_NETWORK:-agent-phi}
